const QUOTES=[{"q": "सफलता का कोई शॉर्टकट नहीं होता, इसके लिए कड़ी मेहनत और पक्का इरादा चाहिए।", "a": "अज्ञात"},{"q": "जो विद्यार्थी आज किताबों के साथ रात जागता है, कल उसी का सूरज सबसे तेज चमकता है।", "a": "दैनिक भास्कर सुविचार"},{"q": "मेहनत इतनी खामोशी से करो कि तुम्हारी सफलता शोर मचा दे।", "a": "अज्ञात"},{"q": "अगर आप सूरज की तरह चमकना चाहते हैं, तो पहले सूरज की तरह जलना सीखें।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "पसीने की स्याही से जो लिखते हैं अपने इरादों को, उनके मुकद्दर के पन्ने कभी कोरे नहीं हुआ करते।", "a": "अज्ञात"},{"q": "परिश्रम ही सौभाग्य की जननी है।", "a": "बेंजामिन फ्रैं कलिन"},{"q": "कोई भी लक्ष्य मनुष्य के साहस से बड़ा नहीं, हारा वही जो लड़ा नहीं।", "a": "अज्ञात"},{"q": "जितना कठिन संघर्ष होगा, जीत उतनी ही शानदार होगी।", "a": "स्वामी विवेकानंद"},{"q": "किस्मत से ज्यादा अपनी काबिलियत पर भरोसा रखो, क्योंकि किस्मत बदलती है पर काबिलियत हमेशा साथ रहती है।", "a": "अज्ञात"},{"q": "कामयाबी हाथों की लकीरों में नहीं, माथे के पसीने में होती है।", "a": "दैनिक भास्कर सुविचार"},{"q": "लगातार किया गया छोटा-छोटा प्रयास एक दिन बड़ी सफलता का रूप ले लेता है।", "a": "अज्ञात"},{"q": "थक कर न बैठ ए मंजिल के मुसाफिर, मंजिल भी मिलेगी और मिलने का मजा भी आएगा।", "a": "अज्ञात"},{"q": "जो अपने कदमों की काबिलियत पर विश्वास रखते हैं, वही अक्सर मंजिल पर पहुंचते हैं।", "a": "अज्ञात"},{"q": "बिना मेहनत के हासिल तख्त-ओ-ताज नहीं होते, ढूंढ लेते हैं अंधेरों में भी मंजिल अपनी।", "a": "अज्ञात"},{"q": "आलस्य मनुष्य का सबसे बड़ा शत्रु है और परिश्रम सबसे बड़ा मित्र।", "a": "आचार्य चाणक्य"},{"q": "सफल होने के लिए सफलता की इच्छा, असफलता के भय से अधिक होनी चाहिए।", "a": "बिल कॉस्बी"},{"q": "आज का दर्द कल की ताकत बनेगा, बस पढ़ाई जारी रखो।", "a": "दैनिक भास्कर सुविचार"},{"q": "नदी जब किनारा छोड़ देती है, तब राह की चट्टान तक तोड़ देती है।", "a": "अज्ञात"},{"q": "पढ़ाई को बोझ नहीं, बल्कि अपने सपनों को सच करने की सीढ़ी समझो।", "a": "अज्ञात"},{"q": "महान कार्य ताकत से नहीं, बल्कि लगातार लगे रहने से पूरे होते हैं।", "a": "सैमुअल जॉनसन"},{"q": "उठो, जागो और तब तक मत रुको जब तक लक्ष्य की प्राप्ति न हो जाए।", "a": "स्वामी विवेकानंद"},{"q": "एक समय में एक काम करो, और ऐसा करते समय अपनी पूरी आत्मा उसमें डाल दो।", "a": "स्वामी विवेकानंद"},{"q": "सपने वो नहीं जो आप नींद में देखते हैं, सपने वो हैं जो आपको नींद ही नहीं आने देते।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "जिस व्यक्ति का लक्ष्य स्पष्ट होता है, रास्ते अपने आप बन जाते हैं।", "a": "अज्ञात"},{"q": "एकाग्रता ही ज्ञान का सबसे बड़ा द्वार है।", "a": "स्वामी विवेकानंद"},{"q": "अपना लक्ष्य इतना बड़ा रखो कि छोटी-मोटी रुकावटें दिखाई ही न दें।", "a": "दैनिक भास्कर सुविचार"},{"q": "जहां आपका ध्यान जाता है, वहीं आपकी ऊर्जा प्रवाहित होती है।", "a": "अज्ञात"},{"q": "बिना लक्ष्य के जीवन बिना पता लिखे लिफाफे की तरह है, जो कहीं नहीं पहुंचता।", "a": "अज्ञात"},{"q": "अर्जुन की तरह के वल मछली की आंख पर निशाना रखो, भटकाव अपने आप दूर हो जाएगा।", "a": "अज्ञात"},{"q": "मंजिल उन्हीं को मिलती है, जिनके सपनों में जान होती है; पंखों से कु छ नहीं होता, हौसलों से उड़ान होती है।", "a": "अज्ञात"},{"q": "हर सुबह अपने लक्ष्य को याद करो और हर रात पूछो कि आज तुम उसके कितने करीब पहुंचे।", "a": "अज्ञात"},{"q": "जब तक आप किसी काम को नहीं करते, तब तक वह असंभव ही लगता है।", "a": "नेल्सन मंडेला"},{"q": "छोटे-छोटे लक्ष्य बनाओ और उन्हें पूरा करते हुए शिखर तक पहुंचो।", "a": "दैनिक भास्कर सुविचार"},{"q": "भटकाव से बचने का सबसे अच्छा तरीका अपने लक्ष्य से प्रेम करना है।", "a": "अज्ञात"},{"q": "दिमाग को शांत रखो, क्योंकि शांत पानी में ही सही प्रतिबिंब दिखाई देता है।", "a": "अज्ञात"},{"q": "एक ही दिशा में पूरी शक्ति लगाने से चट्टान भी टूट जाती है।", "a": "अज्ञात"},{"q": "सफलता की कुं जी के वल लक्ष्य पर ध्यान कें द्रित करना है, बाधाओं पर नहीं।", "a": "अज्ञात"},{"q": "यदि आप एक ही समय में दो खरगोशों का पीछा करेंगे, तो एक भी हाथ नहीं आएगा।", "a": "कन्फ्यूशियस"},{"q": "अपने आप को इतना व्यस्त रखो कि निराशा के लिए कोई जगह ही न बचे।", "a": "अज्ञात"},{"q": "लक्ष्य पाने के लिए जुनून होना चाहिए, वरना बहाने तो हर कोई बना लेता है।", "a": "दैनिक भास्कर सुविचार"},{"q": "समय और शिक्षा का सही उपयोग ही व्यक्ति को सफल बना देता है।", "a": "अज्ञात"},{"q": "जो समय की कद्र नहीं करता, समय एक दिन उसकी कद्र करना छोड़ देता है।", "a": "दैनिक भास्कर सुविचार"},{"q": "अनुशासन ही लक्ष्य और उपलब्धि के बीच का सेतु है।", "a": "जिम रॉन"},{"q": "कल कभी नहीं आता; जो करना है, उसकी शुरुआत आज और अभी से करो।", "a": "कबीर दास"},{"q": "बीता हुआ कल वापस नहीं आ सकता, लेकिन आने वाला कल अभी भी आपके हाथ में है।", "a": "अज्ञात"},{"q": "हर एक मिनट का हिसाब रखो, क्योंकि यही मिनट मिलकर तुम्हारा भविष्य बनाते हैं।", "a": "अज्ञात"},{"q": "सुबह की नींद इंसान के इरादों को कमजोर करती है, मंजिल को हासिल करने वाले कभी देर तक नहीं सोते।", "a": "अज्ञात"},{"q": "निरंतरता (Consistency) साधारण विद्यार्थी को भी असाधारण बना देती है।", "a": "दैनिक भास्कर सुविचार"},{"q": "आज तुम जो समय बर्बाद कर रहे हो, कल वही समय तुम्हें बर्बाद कर देगा।", "a": "अज्ञात"},{"q": "प्रतिभा बिना अनुशासन के उस नाव की तरह है, जिसका कोई नाविक नहीं।", "a": "अज्ञात"},{"q": "रोज का एक घंटा स्वाध्याय आपको भीड़ से कई साल आगे ले जा सकता है।", "a": "अज्ञात"},{"q": "सफल लोग वही करते हैं जो असफल लोग करने से कतराते हैं—समय का सम्मान।", "a": "अज्ञात"},{"q": "अपने आज को बेहतर बनाओ, तुम्हारा कल अपने आप संवर जाएगा।", "a": "अज्ञात"},{"q": "किताबों से दोस्ती कर लो, ये कभी धोखा नहीं देतीं और हमेशा आगे बढ़ाती हैं।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "समय सबसे बड़ा शिक्षक है, बस शर्त यह है कि हम उससे सीखने को तैयार रहें।", "a": "अज्ञात"},{"q": "टालमटोल (Procrastination) सपनों का सबसे बड़ा हत्यारा है।", "a": "अज्ञात"},{"q": "थोड़ा-थोड़ा करके रोज पढ़ने वाला विद्यार्थी, परीक्षा से एक रात पहले जागने वाले से हमेशा जीतता है।", "a": "दैनिक भास्कर सुविचार"},{"q": "आत्म-अनुशासन के बिना सफलता की कल्पना भी नहीं की जा सकती।", "a": "वॉरेन बफे ट"},{"q": "घड़ी की सुई की तरह चलते रहो, रुकोगे तो पीछे छू ट जाओगे।", "a": "अज्ञात"},{"q": "अच्छी आदतें बनाना कठिन है, लेकिन उनके साथ जीना बहुत आसान है।", "a": "अज्ञात"},{"q": "खुद पर विश्वास रखो, तुम जितना सोचते हो उससे कहीं अधिक जानते हो।", "a": "डॉ. बेंजामिन स्पॉक"},{"q": "दुनिया की कोई भी परेशानी आपके साहस से बड़ी नहीं है।", "a": "अज्ञात"},{"q": "जिस दिन आपने अपनी सोच बड़ी कर ली, बड़े-बड़े लोग आपके बारे में सोचना शुरू कर देंगे।", "a": "अज्ञात"},{"q": "अपने आप को किसी से कम मत समझो, हर किसी में एक खास हुनर होता है।", "a": "दैनिक भास्कर सुविचार"},{"q": "विश्वास वह शक्ति है जिससे उजड़ी हुई दुनिया में भी प्रकाश लाया जा सकता है।", "a": "हेलेन के लर"},{"q": "नकारात्मक विचारों को मन में जगह न दें, ये आपकी ऊर्जा को चूस लेते हैं।", "a": "अज्ञात"},{"q": "हालात चाहे जैसे भी हों, हौसला हमेशा बुलंद रखो।", "a": "अज्ञात"},{"q": "जब पूरी दुनिया कहे कि हार मान लो, तब उम्मीद धीरे से कान में कहती है—एक बार फिर प्रयास कर।", "a": "अज्ञात"},{"q": "तुम स्वयं अपने भाग्य के निर्माता हो।", "a": "स्वामी विवेकानंद"},{"q": "दूसरों से अपनी तुलना करना बंद करो, सूरज और चांद दोनों अपने-अपने समय पर चमकते हैं।", "a": "दैनिक भास्कर सुविचार"},{"q": "मुश्किलें के वल बेहतरीन लोगों के हिस्से में आती हैं, क्योंकि वही उसे बेहतरीन तरीके से अंजाम दे सकते हैं।", "a": "अज्ञात"},{"q": "सकारात्मक सोच के साथ किया गया छोटा कार्य भी बड़े परिणाम देता है।", "a": "अज्ञात"},{"q": "डर को अपने ऊपर हावी मत होने दो, डर के आगे ही जीत है।", "a": "अज्ञात"},{"q": "जो खुद पर भरोसा करता है, दुनिया उस पर भरोसा करने लगती है।", "a": "अज्ञात"},{"q": "अंधेरे को कोसने के बजाय एक छोटा सा दीपक जलाना बेहतर है।", "a": "कन्फ्यूशियस"},{"q": "आपकी सबसे बड़ी ताकत आपका आत्मविश्वास और शांत दिमाग है।", "a": "अज्ञात"},{"q": "कभी भी अपनी क्षमताओं पर संदेह न करें, आप इतिहास रचने के लिए बने हैं।", "a": "अज्ञात"},{"q": "प्रशंसा से पिघलना मत और आलोचना से उबलना मत, बस अपने पथ पर चलते रहना।", "a": "दैनिक भास्कर सुविचार"},{"q": "इंसान अपने विचारों से निर्मित प्राणी है, वह जैसा सोचता है वैसा ही बन जाता है।", "a": "महात्मा गांधी"},{"q": "उम्मीद का दामन कभी मत छोड़ो, सबसे अंधेरी रात के बाद ही सवेरा होता है।", "a": "अज्ञात"},{"q": "असफलता एक चुनौती है, इसे स्वीकार करो; क्या कमी रह गई, देखो और सुधार करो।", "a": "हरिवंश राय बच्चन"},{"q": "हार कर जीतने वाले को ही बाजीगर कहते हैं, और सीख कर आगे बढ़ने वाले को विजेता।", "a": "अज्ञात"},{"q": "गलतियां इस बात का सबूत हैं कि आप प्रयास कर रहे हैं।", "a": "अज्ञात"},{"q": "असफलता का अर्थ यह नहीं कि आप असफल हैं, इसका अर्थ के वल यह है कि आप अभी तक सफल नहीं हुए हैं।", "a": "रॉबर्ट शुलर"},{"q": "ठोकरें इंसान को चलना सिखाती हैं, उनसे घबराकर रुकना नहीं चाहिए।", "a": "दैनिक भास्कर सुविचार"},{"q": "गिरकर उठना और फिर से दौड़ना ही असली बहादुरी है।", "a": "नेल्सन मंडेला"},{"q": "परीक्षा के अंक के वल कागज का टुकड़ा हैं, ये आपकी काबिलियत तय नहीं कर सकते।", "a": "अज्ञात"},{"q": "असफलता सफलता की पहली सीढ़ी है, बशर्ते आप उससे सबक लें।", "a": "अज्ञात"},{"q": "मैंने 10,000 ऐसे तरीके खोजे हैं जो काम नहीं करते, मैं असफल नहीं हुआ हूं।", "a": "थॉमस एडिसन"},{"q": "हार तब होती है जब मान लिया जाता है, जीत तब होती है जब ठान लिया जाता है।", "a": "अज्ञात"},{"q": "हर असफलता अपने साथ एक बड़ा अवसर लेकर आती है।", "a": "नेपोलियन हिल"},{"q": "रास्ते बदल लो पर मंजिल मत बदलो, क्योंकि पेड़ पत्तियां बदलते हैं जड़ें नहीं।", "a": "दैनिक भास्कर सुविचार"},{"q": "कमजोरियां हर किसी में होती हैं, पर विजेता अपनी कमजोरियों को ताकत बना लेते हैं।", "a": "अज्ञात"},{"q": "बीती बातों पर पछताने से अच्छा है, नई शुरुआत की जाए।", "a": "अज्ञात"},{"q": "जिंदगी की परीक्षा में कोई फे ल नहीं होता, या तो हम जीतते हैं या फिर सीखते हैं।", "a": "अज्ञात"},{"q": "चट्टान से टकराकर ही लहरों में खूबसूरती आती है।", "a": "अज्ञात"},{"q": "अगर एक दरवाजा बंद होता है, तो मेहनत करने वालों के लिए दूसरा दरवाजा जरूर खुलता है।", "a": "अलेक्जेंडर ग्राहम बेल"},{"q": "मुसीबतों से भागना नई मुसीबतों को निमंत्रण देने के समान है।", "a": "अज्ञात"},{"q": "जब तक सांस है, तब तक आस है; हार मानने का तो सवाल ही नहीं उठता।", "a": "दैनिक भास्कर सुविचार"},{"q": "शिक्षा सबसे शक्तिशाली हथियार है, जिससे आप दुनिया को बदल सकते हैं।", "a": "नेल्सन मंडेला"},{"q": "एक अच्छी किताब हजार दोस्तों के बराबर होती है, जबकि एक अच्छा दोस्त एक लाइब्रेरी के बराबर होता है।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "इंतजार करने वालों को सिर्फ उतना ही मिलता है, जितना कोशिश करने वाले छोड़ देते हैं।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "अपने मिशन में कामयाब होने के लिए आपको अपने लक्ष्य के प्रति एकचित्त निष्ठावान होना पड़ेगा।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "देश का सबसे अच्छा दिमाग क्लासरूम की आखिरी बेंचों पर मिल सकता है।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "विज्ञान मानवता के लिए एक खूबसूरत तोहफा है, हमें इसे बिगाड़ना नहीं चाहिए।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "छोटा लक्ष्य अपराध है; महान लक्ष्य होना चाहिए।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "सीखने से रचनात्मकता आती है, रचनात्मकता सोचने की ओर ले जाती है, सोच ज्ञान देती है और ज्ञान आपको महान बनाता है।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "आप अपना भविष्य नहीं बदल सकते, लेकिन आप अपनी आदतें बदल सकते हैं और निश्चित रूप से आपकी आदतें आपका भविष्य बदल देंगी।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "कठिनाइयां जीवन में इसलिए आती हैं ताकि हम सफलता का आनंद ले सकें ।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "जिस दिन हमारे सिग्नेचर ऑटोग्राफ में बदल जाएं, उस दिन मान लीजिए आप कामयाब हो गए।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "जब तक भारत दुनिया के सामने खड़ा नहीं होता, कोई हमारी इज्जत नहीं करेगा; इस दुनिया में डर के लिए कोई जगह नहीं है।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "आकाश की तरफ देखिए, हम अके ले नहीं हैं; पूरा ब्रह्मांड हमारे लिए अनुकू ल है और जो सपने देखते हैं तथा मेहनत करते हैं उन्हें प्रतिफल देने की साजिश करता है।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "कृ त्रिम सुख की बजाय ठोस उपलब्धियों के पीछे समर्पित रहिए।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "युवाओं को मेरा संदेश है कि कु छ अलग तरीके से सोचें, कु छ नया करने का प्रयत्न करें और अपना रास्ता खुद बनाएं।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "शिक्षण एक बहुत ही महान पेशा है जो किसी व्यक्ति के चरित्र, क्षमता और भविष्य को आकार देता है।", "a": "डॉ. ए.पी.जे. अब्दुल कलाम"},{"q": "खुद को कमजोर समझना सबसे बड़ा पाप है।", "a": "स्वामी विवेकानंद"},{"q": "एक विचार लो; उस विचार को अपना जीवन बना लो—उसके बारे में सोचो, उसके सपने देखो, उस विचार को जियो।", "a": "स्वामी विवेकानंद"},{"q": "ब्रह्मांड की सारी शक्तियां पहले से हमारी हैं; वो हम ही हैं जो अपनी आंखों पर हाथ रख लेते हैं और फिर रोते हैं कि कितना अंधकार है।", "a": "स्वामी विवेकानंद"},{"q": "शिक्षा का अर्थ वह नहीं है जो आपके दिमाग में ठूं स दिया जाए, बल्कि यह जीवन निर्माण और चरित्र निर्माण करने वाली होनी चाहिए।", "a": "स्वामी विवेकानंद"},{"q": "हम वो हैं जो हमें हमारी सोच ने बनाया है, इसलिए इस बात का ध्यान रखिए कि आप क्या सोचते हैं।", "a": "स्वामी विवेकानंद"},{"q": "जब तक आप खुद पर विश्वास नहीं करते, तब तक आप भगवान पर विश्वास नहीं कर सकते।", "a": "स्वामी विवेकानंद"},{"q": "दिन में एक बार खुद से जरूर बात करें, वरना आप एक बेहतरीन इंसान से मिलने का मौका चूक जाएंगे।", "a": "स्वामी विवेकानंद"},{"q": "किसी की निंदा न करें; अगर आप मदद के लिए हाथ बढ़ा सकते हैं तो जरूर बढ़ाएं।", "a": "स्वामी विवेकानंद"},{"q": "दिल और दिमाग के टकराव में हमेशा दिल की सुनो।", "a": "स्वामी विवेकानंद"},{"q": "सत्य को हजार तरीकों से बताया जा सकता है, फिर भी हर एक सत्य ही होगा।", "a": "स्वामी विवेकानंद"},{"q": "शक्ति जीवन है, निर्बलता मृत्यु है; विस्तार जीवन है, संकु चन मृत्यु है।", "a": "स्वामी विवेकानंद"},{"q": "जितना बड़ा संघर्ष होगा, जीत उतनी ही शानदार होगी।", "a": "स्वामी विवेकानंद"},{"q": "यदि परिस्थितियों पर आपकी पकड़ मजबूत है, तो जहर उगलने वाले भी आपका कु छ नहीं बिगाड़ सकते।", "a": "स्वामी विवेकानंद"},{"q": "असंभव को संभव के वल एकाग्र मन की शक्ति से ही किया जा सकता है।", "a": "स्वामी विवेकानंद"},{"q": "जो तुम सोचते हो वो बन जाओगे; यदि तुम खुद को कमजोर सोचते हो तो कमजोर हो जाओगे, और मजबूत सोचते हो तो मजबूत हो जाओगे।", "a": "स्वामी विवेकानंद"},{"q": "शिक्षा सबसे अच्छी मित्र है; एक शिक्षित व्यक्ति हर जगह सम्मान पाता है।", "a": "आचार्य चाणक्य"},{"q": "किसी भी काम को शुरू करने से पहले स्वयं से तीन प्रश्न पूछें—मैं यह क्यों कर रहा हूं, इसके परिणाम क्या हो सकते हैं और क्या मैं सफल होऊं गा?", "a": "आचार्य चाणक्य"},{"q": "दूसरों की गलतियों से सीखो; अपने ही ऊपर प्रयोग करके सीखने को तुम्हारी आयु कम पड़ेगी।", "a": "आचार्य चाणक्य"},{"q": "विद्यार्थी के लिए सबसे बड़ा तप उसका स्वाध्याय और अनुशासन है।", "a": "आचार्य चाणक्य"},{"q": "जैसे ही भय आपके करीब आए, उस पर आक्रमण कर उसे नष्ट कर दीजिए।", "a": "आचार्य चाणक्य"},{"q": "पुस्तकों में रखा ज्ञान और दूसरों के हाथ में गया धन, समय आने पर कभी काम नहीं आते।", "a": "आचार्य चाणक्य"},{"q": "कोई व्यक्ति अपने कार्यों से महान होता है, अपने जन्म से नहीं।", "a": "आचार्य चाणक्य"},{"q": "एक बार जब आप किसी काम को शुरू करते हैं, तो असफलता से डरे नहीं और उसे छोड़े नहीं।", "a": "आचार्य चाणक्य"},{"q": "विद्या कामधेनु के समान है जो हर मौसम में फल देती है और परदेश में माता के समान रक्षा करती है।", "a": "आचार्य चाणक्य"},{"q": "संतुलित दिमाग जैसा कोई सादा नहीं है, और संतोष जैसा कोई सुख नहीं है।", "a": "आचार्य चाणक्य"},{"q": "जो बीत गया उसकी चिंता नहीं करनी चाहिए, न ही भविष्य के बारे में चिंतित होना चाहिए; विवेकवान व्यक्ति के वल वर्तमान में जीते हैं।", "a": "आचार्य चाणक्य"},{"q": "फू लों की सुगंध के वल वायु की दिशा में फै लती है, लेकिन एक व्यक्ति की अच्छाई और ज्ञान हर दिशा में फै लता है।", "a": "आचार्य चाणक्य"},{"q": "स्वाभिमान से जीने के लिए पढ़ाई करो, पाठशाला ही इंसान का सच्चा गहना है।", "a": "सावित्रीबाई फु ले"},{"q": "जाओ, जाकर पढ़ो-लिखो, आत्मनिर्भर बनो और मेहनती बनो।", "a": "सावित्रीबाई फु ले"},{"q": "ज्ञान के बिना सब कु छ खो जाता है; बिना ज्ञान के हम पशु के समान हैं, इसलिए खाली मत बैठो, जाओ और शिक्षा प्राप्त करो।", "a": "सावित्रीबाई फु ले"},{"q": "अज्ञानता को जड़ से उखाड़ फें कने का एकमात्र अस्त्र शिक्षा है।", "a": "सावित्रीबाई फु ले"},{"q": "पुस्तकें वह साधन हैं जिनके माध्यम से हम विभिन्न संस्कृ तियों के बीच पुल का निर्माण कर सकते हैं।", "a": "डॉ. सर्वपल्ली राधाकृ ष्णन"},{"q": "सच्ची शिक्षा वही है जो हमें स्वतंत्र रूप से सोचना सिखाए।", "a": "डॉ. सर्वपल्ली राधाकृ ष्णन"},{"q": "शिक्षक वह नहीं जो छात्र के दिमाग में तथ्यों को जबरन ठूं से, बल्कि वास्तविक शिक्षक तो वह है जो उसे आने वाले कल की चुनौतियों के लिए तैयार करे।", "a": "डॉ. सर्वपल्ली राधाकृ ष्णन"},{"q": "ज्ञान हमें शक्ति देता है, प्रेम हमें परिपूर्णता देता है।", "a": "डॉ. सर्वपल्ली राधाकृ ष्णन"},{"q": "के वल जानकारी का संग्रह करना शिक्षा नहीं है; शिक्षा का उद्देश्य मनुष्य के चरित्र का निर्माण करना है।", "a": "डॉ. सर्वपल्ली राधाकृ ष्णन"},{"q": "शिक्षा वह शेरनी का दूध है, जो पिएगा वो दहाड़ेगा।", "a": "डॉ. बी.आर. आंबेडकर"},{"q": "जीवन लंबा होने के बजाय महान होना चाहिए।", "a": "डॉ. बी.आर. आंबेडकर"},{"q": "शिक्षित बनो, संगठित रहो और संघर्ष करो।", "a": "डॉ. बी.आर. आंबेडकर"},{"q": "मन का विकास ही मानव के अस्तित्व का अंतिम लक्ष्य होना चाहिए।", "a": "डॉ. बी.आर. आंबेडकर"},{"q": "मैं ऐसे धर्म को मानता हूं जो स्वतंत्रता, समानता और भाईचारा सिखाता है।", "a": "डॉ. बी.आर. आंबेडकर"},{"q": "आप के वल समुद्र के किनारे खड़े होकर और पानी को घूरकर समुद्र पार नहीं कर सकते।", "a": "रवींद्रनाथ टैगोर"},{"q": "उच्चतम शिक्षा वह है जो हमें के वल जानकारी ही नहीं देती, बल्कि हमारे जीवन को समस्त अस्तित्व के साथ सामंजस्य बिठाना सिखाती है।", "a": "रवींद्रनाथ टैगोर"},{"q": "बच्चे को अपनी ही शिक्षा तक सीमित मत रखिए, क्योंकि वह किसी और समय में पैदा हुआ है।", "a": "रवींद्रनाथ टैगोर"},{"q": "तथ्य कई हैं, लेकिन सत्य एक ही है।", "a": "रवींद्रनाथ टैगोर"},{"q": "सफलता की सबसे खास बात है कि वो मेहनत करने वालों पर फिदा हो जाती है।", "a": "खान सर (Khan Sir)"},{"q": "जिंदगी में कभी किसी के सहारे मत बैठना, क्योंकि सहारे चाहे कितने भी सच्चे हों, एक दिन साथ छोड़ ही देते हैं।", "a": "खान सर (Khan Sir)"},{"q": "अगर आप अपनी गरीबी और हालात बदलना चाहते हैं, तो किताबों से दोस्ती कर लीजिए।", "a": "खान सर (Khan Sir)"},{"q": "भीड़ हमेशा उस रास्ते पर चलती है जो रास्ता आसान लगता है, लेकिन इसका मतलब यह नहीं कि भीड़ हमेशा सही रास्ते पर चलती है।", "a": "खान सर (Khan Sir)"},{"q": "पढ़ाई में मन न लगे तो अपने माता-पिता की मेहनत को याद कर लेना, आलस अपने आप भाग जाएगा।", "a": "खान सर (Khan Sir)"},{"q": "जो पानी से नहाएगा वो सिर्फ लिबास बदलेगा, लेकिन जो पसीने से नहाएगा वो एक दिन इतिहास बदलेगा।", "a": "खान सर (Khan Sir)"},{"q": "क्यों डरें जिंदगी में क्या होगा, कु छ न होगा तो तजुर्बा होगा।", "a": "डॉ. विकास दिव्यकीर्ति"},{"q": "पढ़ाई के वल नौकरी पाने का माध्यम नहीं है, बल्कि यह आपको एक बेहतर और संवेदनशील इंसान बनाती है।", "a": "डॉ. विकास दिव्यकीर्ति"},{"q": "सफलता का सबसे बड़ा रहस्य निरंतरता है; रोज थोड़ा-थोड़ा पढ़ना ही आपको शिखर तक ले जाता है।", "a": "डॉ. विकास दिव्यकीर्ति"},{"q": "असफलता से घबराना नहीं चाहिए, क्योंकि दुनिया के सबसे सफल लोग वही हैं जिन्होंने सबसे ज्यादा असफलताएं झेली हैं।", "a": "डॉ. विकास दिव्यकीर्ति"},{"q": "किताबें पढ़ने की आदत डालिए; जो व्यक्ति पढ़ता है, वह एक ही जीवन में हजार जीवन जी लेता है।", "a": "डॉ. विकास दिव्यकीर्ति"},{"q": "जब भी मन भटके , खुद से पूछो कि तुमने यह सफर शुरू क्यों किया था।", "a": "डॉ. विकास दिव्यकीर्ति"},{"q": "हालात चाहे जो भी हों, अपनी पढ़ाई मत छोड़ो; कलम ही आपकी किस्मत बदलेगी।", "a": "अलख पांडे (Physics Wallah)"},{"q": "सपने देखना आसान है, लेकिन उन्हें पूरा करने के लिए हर रोज खुद को तपाना पड़ता है।", "a": "अलख पांडे (Physics Wallah)"},{"q": "रिवीजन ही सफलता की असली कुं जी है; जो पढ़ा है उसे बार-बार दोहराओ।", "a": "अलख पांडे (Physics Wallah)"},{"q": "असफलता के वल यह बताती है कि आपकी तैयारी में अभी कु छ कमी बाकी है, इसे सुधारें और फिर जुट जाएं।", "a": "अलख पांडे (Physics Wallah)"},{"q": "मंजिल उन्हीं को मिलती है जो आखिरी सांस तक हार नहीं मानते।", "a": "अलख पांडे (Physics Wallah)"},{"q": "गणित और विज्ञान रटने के नहीं, बल्कि समझने और अभ्यास करने के विषय हैं।", "a": "आनंद कु मार (Super 30)"},{"q": "अभाव कभी भी प्रतिभा को रोक नहीं सकता, यदि आपके अंदर सीखने की सच्ची भूख है।", "a": "आनंद कु मार (Super 30)"},{"q": "समस्या से भागने की बजाय उसका सामना करो, समाधान उसी के अंदर छिपा होता है।", "a": "आनंद कु मार (Super 30)"},{"q": "कठिन से कठिन प्रश्न भी निरंतर अभ्यास के सामने घुटने टेक देता है।", "a": "आनंद कु मार (Super 30)"},{"q": "जिस दिन विद्यार्थी प्रश्न पूछना सीख जाता है, उसी दिन उसकी असली शिक्षा शुरू होती है।", "a": "भारतीय शिक्षक वाणी"},{"q": "मोबाइल और सोशल मीडिया का उपयोग के वल ज्ञान बढ़ाने के लिए करें, समय गंवाने के लिए नहीं।", "a": "भारतीय शिक्षक वाणी"},{"q": "नोट्स हमेशा अपने हाथों से बनाओ, क्योंकि खुद के लिखे शब्द दिमाग में सबसे ज्यादा समय तक रहते हैं।", "a": "भारतीय शिक्षक वाणी"},{"q": "परीक्षा का तनाव लेने के बजाय अपनी तैयारी पर भरोसा रखो।", "a": "भारतीय शिक्षक वाणी"},{"q": "सुबह जल्दी उठकर पढ़ने की आदत आपको दिन भर दूसरों से आगे रखती है।", "a": "भारतीय शिक्षक वाणी"},{"q": "मॉक टेस्ट में कम अंक आने पर निराश मत हो, बल्कि अपनी गलतियों को पहचान कर उन्हें सुधारो।", "a": "भारतीय शिक्षक वाणी"},{"q": "सफल विद्यार्थी बहाने नहीं बनाते, वे हर परिस्थिति में पढ़ने का रास्ता निकाल लेते हैं।", "a": "भारतीय शिक्षक वाणी"},{"q": "अपने गुरुओं और माता-पिता का सम्मान करो, उनका आशीर्वाद हर कठिन राह को आसान बना देता है।", "a": "भारतीय शिक्षक वाणी"},{"q": "एक-एक अध्याय को गहराई से समझो, अधूरा ज्ञान हमेशा भ्रम पैदा करता है।", "a": "भारतीय शिक्षक वाणी"},{"q": "आज की एकाग्रता कल आपके नाम के आगे एक सम्मानजनक पद जोड़ सकती है।", "a": "भारतीय शिक्षक वाणी"},{"q": "जब दुनिया सो रही हो, तब भी अगर आप पढ़ रहे हैं, तो यकीन मानिए आप इतिहास रच रहे हैं।", "a": "भारतीय शिक्षक वाणी"},{"q": "सफलता का कोई जादू नहीं होता, यह के वल सही दिशा में किए गए निरंतर प्रयास का परिणाम है।", "a": "भारतीय शिक्षक वाणी"},{"q": "अपने लक्ष्य को अपनी स्टडी टेबल के सामने लिखकर लगाओ, ताकि हर पल तुम्हें तुम्हारा मकसद याद रहे।", "a": "भारतीय शिक्षक वाणी"},{"q": "अच्छी संगति विद्यार्थी को ऊं चाइयों पर ले जाती है, जबकि बुरी संगति समय और भविष्य दोनों नष्ट कर देती है।", "a": "भारतीय शिक्षक वाणी"},{"q": "किसी भी विषय को कठिन मत मानो; जो विषय कठिन लगे, उसे सबसे पहले और सबसे ज्यादा समय दो।", "a": "भारतीय शिक्षक वाणी"},{"q": "सच्चा विद्यार्थी वही है जो हार मानने के बजाय हर बार एक नई ऊर्जा के साथ उठ खड़ा होता है।", "a": "भारतीय शिक्षक वाणी"},{"q": "पढ़ाई के साथ-साथ अपने स्वास्थ्य और नींद का भी ध्यान रखें, स्वस्थ शरीर में ही स्वस्थ मस्तिष्क निवास करता है।", "a": "भारतीय शिक्षक वाणी"},{"q": "धैर्य, अनुशासन और आत्मविश्वास—ये तीन मंत्र हर विद्यार्थी को अजेय बना देते हैं।", "a": "भारतीय शिक्षक वाणी"},{"q": "ज्ञान ही वह धन है जिसे न कोई चुरा सकता है और न कोई बांट सकता है; इसे जितना बांटोगे यह उतना ही बढ़ेगा।", "a": "भारतीय शिक्षक वाणी"},{q:"शिक्षा वह शेरनी का दूध है, जो पिएगा वह दहाड़ेगा।",a:"डॉ. बाबासाहेब आंबेडकर"},{q:"मैं किसी समुदाय की प्रगति को महिलाओं द्वारा हासिल की गई प्रगति की डिग्री से मापता हूँ।",a:"डॉ. बाबासाहेब आंबेडकर"},{q:"हम भी दरिया है, रास्ता तो बना ही लेंगे!",a:""},{q:"कुछ ही दिनों की बात है, ये वक्त भी गुजर जाएगा!",a:""},{q:"सफलता किसी मंजिल का नाम नहीं, यह तो रोज खुद से की गई एक ईमानदार कोशिश का परिणाम है।",a:""},{q:"जीवन में परिवर्तन तभी आता है जब हम बहाने नहीं, समाधान ढूंढने लगते हैं।",a:""},{q:"जब ज्ञान चक्षु खुलते हैं, तो व्यक्ति शब्दों के बीच के गैप और साइलेंस को भी पढ़ लेता है, क्योंकि कुछ न कहना भी कहना होता है।",a:""},{q:"राजा बनने का शौक है, तो गुलाम की तरह मेहनत करना सीखिए",a:""},{q:"जिस दिन आलस छोड़ दोगे, उस दिन किस्मत खुद लाइन में खड़ी मिलेगी!",a:""},{q:"डर के आगे नहीं, मेहनत के आगे सफलता झुकती है!",a:""},{q:"जिस दिन तुम खुद से जीत गए, उस दिन दुनिया अपने आप हार जाएगी!",a:""},{q:"शिक्षा सबसे बड़ा हथियार, मेटल डिटेक्टर में नहीं पकड़ा जाता",a:""},{q:"खाली पेट और खाली जेब जो सिखाते हैं, वो किसी यूनिवर्सिटी-कॉलेज में सीखने को नहीं मिलता",a:""},{q:"पढ़ाई ऐसे करिए, जैसे कोई नोट गिन रहा हो",a:""},{q:"गलती करना बुरा नहीं, गलती से सीखना न आना बुरा है!",a:""},{q:"अगर तुमने अपना 100% दिया तो सिलेक्शन हो या ना हो, प्रयास करने का सुकून जीवन भर रहेगा। मेहनत की आदत तुम्हें जीवन में आगे ले जाएगी।",a:""},{q:"किसी के नकारात्मक विचारों से प्रभावित न हों, बल्कि अपनी सफलता से जवाब दें। समय बर्बाद न करें।",a:""},{q:"आप फोकस्ड होने चाहिए, अगर आपने फोकस छोड़ दिया तो फिर आप सिलेक्ट नहीं हो सकते।",a:""},{q:"ईमानदारी से पढ़ो, क्योंकि तुम्हारी निरंतरता (consistency) ही तय करती है कि तुम कहाँ पहुँचोगे।",a:""},{q:"हम माता-पिता के ऋण से कभी मुक्त नहीं हो सकते, इसलिए उनकी मेहनत को व्यर्थ मत जाने दो।",a:""},{q:"शिक्षित बनो, संगठित रहो, संघर्ष करो।",a:"डॉ. बाबासाहेब आंबेडकर"},{q:"मन की खेती मानव अस्तित्व का अंतिम लक्ष्य होना चाहिए।",a:""},{q:"इस पूरी दुनिया में गरीब वही है जो शिक्षित नहीं है, इसलिए आधी रोटी खा लेना लेकिन अपने बच्चों को जरूर पढ़ाना।",a:""},{q:"जो लोग इतिहास को भूल जाते हैं, वे इतिहास नहीं बना सकते",a:""},{q:'Dream, dream, dream. Dreams transform into thoughts and thoughts result in action.',a:'Dr. APJ Abdul Kalam'},{q:'Arise, awake, and stop not till the goal is reached.',a:'Swami Vivekananda'},{q:'Education is the manifestation of the perfection already in man.',a:'Swami Vivekananda'},{q:'Excellence is a continuous process and not an accident.',a:'Dr. APJ Abdul Kalam'},{q:'Strength is life, weakness is death.',a:'Swami Vivekananda'},{q:'You cannot believe in God until you believe in yourself.',a:'Swami Vivekananda'},{q:'If you want to shine like a sun, first burn like a sun.',a:'Dr. APJ Abdul Kalam'},{q:'Learning gives creativity, creativity leads to thinking, thinking provides knowledge, knowledge makes you great.',a:'Dr. APJ Abdul Kalam'}];

<div class="cd" style="--c:#f59e0b"><b>📄 अध्ययन सामग्री</b><select id="nty">${tyOpts()}</select><input id="ntt" placeholder="शीर्षक"><textarea id="ntb" placeholder="सामग्री लिखें"></textarea><button class="p w" onclick="addN()">सेव करें</button></div>
<div class="cd" style="--c:#ef4444"><b>🔴 Live Test बनाएँ (रैंक के लिए)</b><input id="lnm" placeholder="टेस्ट का नाम"><input id="lmn" type="number" value="30"><input type="file" accept=".json,.csv,.tsv,.txt,.xlsx" onchange="fl2(this,'lq')"><textarea id="lq" placeholder="प्रश्न (ऊपर वाला format)"></textarea><button class="p w" onclick="addL()">Live शुरू करें</button>${LV.map(t=>`<div class="row sp" style="margin-top:8px"><span>${E(t.name)}</span><button onclick="offL(${t.id})" style="flex:0">बंद</button></div>`).join('')}</div>
<div class="cd"><b>हाल के जोड़े प्रश्न</b>${AR.map(r=>`<div class="row sp"><span class="mu">${E(r.q.slice(0,40))}</span><button onclick="go('ed',{id:'c${r.rid}',bk:'ad'})" style="flex:0">✏</button><button onclick="delQ(${r.rid})" style="flex:0">🗑</button></div>`).join('')||'<div class="mu">कोई नहीं</div>'}</div><button class="w" onclick="go('pf')">← वापस</button>`}
async function ins(tb,rows,ok){const{error}=await db.from(tb).insert(rows);if(error)return alert(error.message);alert(ok);await loadAll();go('ad')}
function addQ(){let a;try{a=tsv($('#aq').value)}catch(e){return alert(e)}if(!a.length)return alert('कुछ लिखें');const ty=$('#aty').value;ins('custom_questions',a.map(q=>({ty,data:q})),a.length+' प्रश्न जुड़े')}
function addT(){const n=$('#atn').value.trim();if(!n)return;ins('custom_types',[{sec:$('#ase').value,name:n}],'जुड़ गया')}
function addN(){const t=$('#ntt').value.trim(),b=$('#ntb').value.trim();if(!t||!b)return alert('शीर्षक और सामग्री दोनों लिखें');ins('custom_notes',[{ty:$('#nty').value,title:t,body:b}],'सेव हुआ')}
function addL(){let a;try{a=tsv($('#lq').value)}catch(e){return alert(e)}const n=$('#lnm').value.trim();if(!n||!a.length)return alert('नाम और प्रश्न चाहिए');ins('live_tests',[{name:n,mins:+$('#lmn').value||30,qs:a}],'Live टेस्ट चालू')}
async function offL(id){await db.from('live_tests').update({active:false}).eq('id',id);await loadAll();go('ad')}
async function delQ(id){if(!confirm('हटाएँ?'))return;await db.from('custom_questions').delete().eq('id',id);await loadAll();go('ad')}
boot();
</script></body></html>
